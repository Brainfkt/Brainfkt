name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Get Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Patch stars counter
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('today.py')
          source = path.read_text()
          old = "    for node in data: total_stars += node['node']['stargazers']['totalCount']"
          new = "    for node in data:\n        if node.get('node') and node['node'].get('stargazers'):\n            total_stars += node['node']['stargazers'].get('totalCount', 0)"
          if old in source:
              path.write_text(source.replace(old, new))
          PY
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: Brainfkt
        run: python today.py
      - name: Commit
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@brainfkt.github.io"
          git config --global user.name "Brainfkt/GitHub-Actions-Bot"
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push
