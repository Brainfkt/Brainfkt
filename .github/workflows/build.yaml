name: README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Get Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Generate and publish README assets
        shell: bash
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: Brainfkt
        run: |
          git config user.email "github-actions-bot@brainfkt.github.io"
          git config user.name "Brainfkt/GitHub-Actions-Bot"
          git fetch --no-tags origin "$GITHUB_REF"
          for attempt in 1 2 3; do
            base=$(git rev-parse FETCH_HEAD)
            git checkout --detach "$base"
            python today.py
            python update_stars.py
            git add -- dark_mode.svg light_mode.svg 'cache/*.txt'
            if git diff --cached --quiet; then
              echo "README assets are up to date"
              exit 0
            fi
            git commit -m "Updated README"
            if git push origin "HEAD:$GITHUB_REF"; then
              exit 0
            fi
            git fetch --no-tags origin "$GITHUB_REF"
            if [[ $(git rev-parse FETCH_HEAD) == "$base" || $attempt == 3 ]]; then
              exit 1
            fi
            echo "Branch advanced during generation. Regenerating on the new commit."
          done
